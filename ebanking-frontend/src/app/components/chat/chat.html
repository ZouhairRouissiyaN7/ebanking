<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">
        <i class="bi bi-chat-dots me-2"></i>
        eBanking AI Assistant
      </h5>
    </div>

    <div class="card-body overflow-auto" style="height: 420px">
      @if (messages().length === 0) {
        <div class="text-center text-muted py-5">
          <i class="bi bi-robot fs-1"></i>
          <p class="mt-3">Ask me about banking and the eBanking application.</p>
        </div>
      }

      @for (message of messages(); track $index) {
        <div class="d-flex mb-3" [class.justify-content-end]="message.role === 'user'">
          <div
            class="rounded-3 p-3"
            style="max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere"
            [class.bg-primary]="message.role === 'user'"
            [class.text-white]="message.role === 'user'"
            [class.bg-light]="message.role === 'assistant'"
          >
            {{ message.text }}
          </div>
        </div>
      }

      @if (loading()) {
        <div class="text-muted">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Assistant is thinking...
        </div>
      }
    </div>

    <div class="card-footer">
      @if (errorMessage()) {
        <div class="alert alert-danger mb-3">
          {{ errorMessage() }}
        </div>
      }

      <form class="d-flex gap-2" (ngSubmit)="sendMessage()">
        <input
          class="form-control"
          name="message"
          placeholder="Ask a banking question..."
          [ngModel]="input()"
          (ngModelChange)="input.set($event)"
          [disabled]="loading()"
        />

        <button type="submit" class="btn btn-primary" [disabled]="loading() || !input().trim()">
          <i class="bi bi-send"></i>
          Send
        </button>
      </form>
    </div>
  </div>
</div>
