server.port=8082

spring.datasource.url=jdbc:mysql://192.168.80.206:3306/account_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.slidingWindowSize=4
resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.minimumNumberOfCalls=4

resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.failureRateThreshold=50

resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.automaticTransitionFromOpenToHalfOpenEnabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.CustomerClientgetCustomerLong.registerHealthIndicator=false