server.port=8084

app.jwt.issuer=http://localhost:8084
app.jwt.access-token-minutes=15

app.jwt.keystore-path=${JWT_KEYSTORE_PATH}
app.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD}
app.jwt.key-alias=jwt-signing

# Dev login 
app.auth.admin-username=${AUTH_ADMIN_USERNAME}
app.auth.admin-password=${AUTH_ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health,info