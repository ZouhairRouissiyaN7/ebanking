server.port=8888

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/accounts/**,/api/operations/**

spring.cloud.gateway.server.webflux.routes[2].id=chatbot-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://chatbot-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chat/**

spring.cloud.gateway.server.webflux.routes[3].id=customer-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/customer/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[4].id=account-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/account/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/auth/**

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/docs/customer/v3/api-docs

springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/docs/account/v3/api-docs

springdoc.swagger-ui.urlsPrimaryName=Account Service
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway