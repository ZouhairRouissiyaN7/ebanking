eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

app.security.jwt.issuer=http://localhost:8084
app.security.jwt.audience=ebanking-api
app.security.jwt.jwk-set-uri=http://localhost:8084/.well-known/jwks.json